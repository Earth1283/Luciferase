name: Luciferase CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify fork boundaries
        run: ./scripts/verify-luciferase-fork.sh all

      - name: Apply patches
        run: bash gradlew applyAllPatches

      - name: Build Paperclip server
        run: bash gradlew createPaperclipJar

      - name: Upload Luciferase server
        uses: actions/upload-artifact@v7
        with:
          name: Luciferase server
          path: lophine-server/build/libs/luciferase-paperclip-*.jar
          if-no-files-found: error
